[global]
# scroller settings
scroller_default_proportion = 0.5
scroller_ignore_proportion_single = 0
scroller_default_proportion_single = 1.0
scroller_focus_center = 0
#scroller_proportion_preset = "0.5,0.8,1.0"
scroller_proportion_preset= 0.33333,0.5

# vertical_scroller on DP-6 (later rules win over shared/layouts.toml)
[[rule.tag_rule]]
id = "*"
monitor_name = "^DP-6$"
layout_name = "vertical_scroller"
