# Ported from hypr shared/env.lua, shared/theme.lua
# HYPRCURSOR_* dropped (Hyprland-only); cursor is set via cursor_theme/cursor_size.
[global]
cursor_theme = "Breeze5_Snow"
cursor_size = 24

[env]
"XDG_SESSION_TYPE" = "wayland"
"BROWSER" = "zen-browser"
"EDITOR" = "nvim"
"QT_QPA_PLATFORMTHEME" = "qt6ct"
"XCURSOR_THEME" = "Breeze5_Snow"
"XCURSOR_SIZE" = "24"
